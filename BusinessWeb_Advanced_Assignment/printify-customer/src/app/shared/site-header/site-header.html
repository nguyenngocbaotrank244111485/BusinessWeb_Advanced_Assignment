<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="PrintiFy - Trang chủ">
      <span class="brand-symbol" aria-hidden="true">P<span>✦</span></span>
      <span class="brand-text">Print<span>iFy</span><small>MAKE IT YOURS</small></span>
    </a>

    <nav class="primary-nav" aria-label="Điều hướng chính">
      <a routerLink="/" [class.nav-current]="active === 'home'">Trang chủ</a>
      <a routerLink="/products" [class.nav-current]="active === 'products'">Sản phẩm</a>
      <a routerLink="/market" [class.nav-current]="active === 'market'">Marketplace</a>
      <a routerLink="/about" [class.nav-current]="active === 'about'">Giới thiệu</a>
    </nav>

    <form class="header-search" role="search" (submit)="$event.preventDefault(); search(box)">
      <span aria-hidden="true">⌕</span>
      <input #box type="search" placeholder="Tìm sản phẩm..." aria-label="Tìm sản phẩm" />
    </form>

    <div class="header-actions">
      <a routerLink="/cart" class="cart-link" aria-label="Giỏ hàng">
        <span aria-hidden="true">🛒</span>
        <span class="cart-text">Giỏ hàng</span>
        @if (cart.count() > 0) {
          <span class="cart-badge">{{ cart.count() }}</span>
        }
      </a>
      <a routerLink="/auth/login" class="auth-login">Đăng nhập</a>
      <a routerLink="/auth/register" class="auth-register">Đăng ký</a>
    </div>
  </div>
</header>
